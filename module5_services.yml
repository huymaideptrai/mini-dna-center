---
- name: Cấu hình Module 5 - Services & Management
  # Lấy IP thiết bị từ FastAPI truyền sang (nếu không có sẽ mặc định chạy vào 'all' trong inventory)
  hosts: "{{ target_ip | default('all') }}"
  gather_facts: no
  
  tasks:
    - name: Triển khai cấu hình Services & Management xuống Router
      cisco.ios.ios_config:
        lines: |
          ! ==========================================
          ! 1. CẤU HÌNH AAA (BẢO MẬT TRUY CẬP)
          ! ==========================================
          {% if aaa is defined and aaa|length > 0 %}
          aaa new-model
          {% for a in aaa %}
          {% if a.type == 'radius' %}
          radius server {{ a.ip }}
           address ipv4 {{ a.ip }}
           key {{ a.key }}
          {% elif a.type == 'tacacs+' %}
          tacacs server {{ a.ip }}
           address ipv4 {{ a.ip }}
           key {{ a.key }}
          {% endif %}
          {% endfor %}
          {% endif %}

          ! ==========================================
          ! 2. CẤU HÌNH SYSLOG (LOGGING)
          ! ==========================================
          {% if syslog is defined %}
          {% for s in syslog %}
          logging host {{ s.ip }}
          logging trap {{ s.level }}
          {% endfor %}
          {% endif %}

          ! ==========================================
          ! 3. CẤU HÌNH FILE TRANSFER (FTP / TFTP)
          ! ==========================================
          {% if file_transfer is defined %}
          {% for f in file_transfer %}
          {% if f.type == 'ftp' %}
          ip ftp username {{ f.user }}
          ip ftp password {{ f.pass_key }}
          {% endif %}
          {% endfor %}
          {% endif %}

          ! ==========================================
          ! 4. CẤU HÌNH DHCP SERVER
          ! ==========================================
          {% if dhcp is defined %}
          {% for d in dhcp %}
          {% if d.exclude != '' %}
          ip dhcp excluded-address {{ d.exclude }}
          {% endif %}
          ip dhcp pool {{ d.name }}
           network {{ d.net }} {{ d.mask }}
           default-router {{ d.gw }}
          {% if d.dns != '' %}
           dns-server {{ d.dns }}
          {% endif %}
          {% endfor %}
          {% endif %}

          ! ==========================================
          ! 5. CẤU HÌNH IP SLA (GIÁM SÁT MẠNG)
          ! ==========================================
          {% if ipsla is defined %}
          {% for i in ipsla %}
          ip sla {{ i.id }}
           icmp-echo {{ i.dest }}
           frequency {{ i.freq }}
          {% if i.sched == 'life forever' %}
          ip sla schedule {{ i.id }} life forever start-time now
          {% endif %}
          {% endfor %}
          {% endif %}

          ! ==========================================
          ! 6. CẤU HÌNH ĐỒNG BỘ THỜI GIAN (NTP)
          ! ==========================================
          {% if ntp is defined %}
          {% for n in ntp %}
          ntp server {{ n.ip }}{% if n.prefer == 'yes' %} prefer{% endif %}
          
          {% endfor %}
          {% endif %}
